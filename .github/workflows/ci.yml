name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend – install & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test – health endpoint
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key
          JWT_SECRET_KEY: ci-jwt-secret-key
        run: |
          python - <<'EOF'
          import os
          os.environ.setdefault("SECRET_KEY", "ci-secret-key")
          os.environ.setdefault("JWT_SECRET_KEY", "ci-jwt-secret-key")
          from app import app
          with app.test_client() as client:
              resp = client.get("/api/health")
              assert resp.status_code == 200, f"Expected 200, got {resp.status_code}"
              data = resp.get_json()
              assert data.get("status") == "healthy", f"Unexpected body: {data}"
              print("Smoke test passed:", data)
          EOF

  frontend:
    name: Frontend – install & build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
        run: npm run build
